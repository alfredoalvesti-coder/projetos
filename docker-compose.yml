services:
  postgres:
    image: postgres:16-alpine
    container_name: barbearia-singer-db
    environment:
      POSTGRES_DB: barbearia_singer
      POSTGRES_USER: barbearia
      POSTGRES_PASSWORD: barbearia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbearia -d barbearia_singer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
